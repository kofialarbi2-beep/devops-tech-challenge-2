apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tech2-flask
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kofialarbi2-beep/devops-tech-challenge-2.git
    targetRevision: gitops
    path: helm/tech2-flask
    helm:
      releaseName: tech2-flask
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
