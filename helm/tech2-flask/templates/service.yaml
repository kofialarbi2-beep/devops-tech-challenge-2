
apiVersion: v1
kind: Service
metadata:
  name: tech2-flask-service
  labels:
    app: tech2-flask
spec:
  type: {{ .Values.service.type }}
  selector:
    app: tech2-flask
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
